name: super_driver
description: "Super Driver - Uber trip price checker"
publish_to: "none"

version: 1.1.2+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/localization/ar.json
    - assets/localization/en.json
    - assets/images/logo.png
