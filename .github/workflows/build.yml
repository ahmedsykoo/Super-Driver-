name: Build Super Driver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # IMPORTANT: no Gradle cache here.
          # The repository may contain only the source ZIP at checkout time.

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Locate and extract source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -name '*.zip' -not -path './.git/*' | head -n 1 || true)"

          if [[ -n "$ZIP_FILE" ]]; then
            echo "Source ZIP: $ZIP_FILE"
            rm -rf _source
            mkdir -p _source
            unzip -q -o "$ZIP_FILE" -d _source
          fi

          PROJECT_DIR="$(find . -type f -name pubspec.yaml -not -path './.git/*' -printf '%h\n' | head -n 1 || true)"

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::pubspec.yaml was not found after source extraction."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Repair Dart dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          s = p.read_text()

          s = s.replace(
              "  flutter_linter: ^3.0.0",
              "  flutter_lints: ^3.0.2"
          )

          for line in (
              "  permission_handler: ^11.4.4\n",
              "  accessibility_service: ^0.0.1\n",
              "  flutter_service_binding: ^1.0.0\n",
          ):
              s = s.replace(line, "")

          p.write_text(s)
          PY

      - name: Recreate Android host
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          # The original Android folder is incomplete/mixed with incompatible
          # Gradle versions. Generate a clean Android host with the pinned
          # Flutter SDK, then add the required native Accessibility Service.

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.superdriver \
            --project-name super_driver \
            --no-pub \
            .

          # flutter create generates a default widget_test.dart that expects
          # a class named MyApp. This project uses SuperDriverApp, so the
          # generated test is stale and must not be left in the source tree.
          rm -f test/widget_test.dart

          # Fail early if an obsolete generated test is still present.
          if [[ -f test/widget_test.dart ]]; then
            echo "::error::Stale test/widget_test.dart is still present."
            exit 1
          fi

          mkdir -p android/app/src/main/kotlin/com/superdriver/app
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:label="Super Driver"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".UberAccessibilityService"
                      android:label="Super Driver"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:accessibilityFlags="flagReportViewIds" />
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Super Driver</string>
              <string name="accessibility_service_description">Reads Uber trip offer text and shows the Super Driver result.</string>
          </resources>
          EOF

          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(dirname "$(dirname "$FLUTTER_BIN")")"
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          test -d "$ANDROID_SDK"

          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK
          flutter.sdk=$FLUTTER_SDK
          EOF

          chmod +x android/gradlew

          cat > android/app/src/main/kotlin/com/superdriver/app/MainActivity.kt <<'EOF'
          package com.superdriver.app

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.superdriver/accessibility"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "enableAccessibility" -> {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                              result.success(true)
                          }

                          "openOverlaySettings" -> {
                              if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                                  startActivity(
                                      Intent(
                                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                          Uri.parse("package:$packageName")
                                      )
                                  )
                              }
                              result.success(true)
                          }

                          else -> result.notImplemented()
                      }
                  }
              }
          }
          EOF

          cat > android/app/src/main/kotlin/com/superdriver/app/UberAccessibilityService.kt <<'EOF'
          package com.superdriver.app

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.TextView
          import java.util.Locale
          import java.util.regex.Pattern

          class UberAccessibilityService : AccessibilityService() {

              private var overlayView: TextView? = null
              private var windowManager: WindowManager? = null

              private val pricePattern = Pattern.compile(
                  """(?<!\d)(\d+(?:[.,]\d+)?)\s*(?:ج\s*\.?\s*م|ج\.م|EGP)""",
                  Pattern.CASE_INSENSITIVE
              )

              private val distancePattern = Pattern.compile(
                  """\(?\s*(\d+(?:[.,]\d+)?)\s*\)?\s*(?:كلم|كم|km)\b""",
                  Pattern.CASE_INSENSITIVE
              )

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return

                  val packageName = event.packageName?.toString() ?: return

                  if (packageName != "com.ubercab.driver" &&
                      packageName != "com.uber.client") {
                      return
                  }

                  val root = rootInActiveWindow ?: return
                  val text = StringBuilder()
                  collectText(root, text)

                  val trip = parseTrip(text.toString()) ?: return
                  showResult(trip.first, trip.second)
              }

              private fun collectText(
                  node: AccessibilityNodeInfo,
                  out: StringBuilder
              ) {
                  node.text?.let {
                      if (it.isNotBlank()) out.append(it).append(' ')
                  }

                  for (i in 0 until node.childCount) {
                      node.getChild(i)?.let { child ->
                          collectText(child, out)
                          child.recycle()
                      }
                  }
              }

              private fun parseTrip(text: String): Pair<Double, Double>? {
                  val priceMatch = pricePattern.matcher(text)
                  val distanceMatch = distancePattern.matcher(text)

                  if (!priceMatch.find() || !distanceMatch.find()) return null

                  val price = priceMatch.group(1)
                      .replace(',', '.')
                      .toDoubleOrNull() ?: return null

                  val distance = distanceMatch.group(1)
                      .replace(',', '.')
                      .toDoubleOrNull() ?: return null

                  if (price <= 0.0 || distance <= 0.0) return null

                  return Pair(price, distance)
              }

              private fun readDoublePreference(
                  key: String,
                  defaultValue: Double
              ): Double {
                  val prefs = getSharedPreferences(
                      "FlutterSharedPreferences",
                      MODE_PRIVATE
                  )
                  val value = prefs.all[key] ?: return defaultValue

                  return when (value) {
                      is Number -> value.toDouble()
                      is String -> value.toDoubleOrNull() ?: defaultValue
                      else -> defaultValue
                  }
              }

              private fun showResult(price: Double, distance: Double) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      !Settings.canDrawOverlays(this)) {
                      return
                  }

                  val minPrice = readDoublePreference("flutter.minPrice", 7.5)
                  val discount = readDoublePreference("flutter.uberDiscount", 0.0)

                  val gross = price / distance
                  val net = gross * (1.0 - discount / 100.0)
                  val suitable = net >= minPrice

                  val rate = String.format(Locale.US, "%.2f", net)
                  val text = if (suitable) {
                      "✓ مناسب  $rate ج.م/كم"
                  } else {
                      "✕ غير مناسب  $rate ج.م/كم"
                  }

                  val background = if (suitable) {
                      Color.rgb(22, 128, 68)
                  } else {
                      Color.rgb(199, 53, 53)
                  }

                  val view = overlayView ?: TextView(this).also {
                      it.setPadding(28, 18, 28, 18)
                      it.setTextColor(Color.WHITE)
                      it.textSize = 16f
                      it.typeface = Typeface.DEFAULT_BOLD
                      it.gravity = Gravity.CENTER
                      it.setOnClickListener { clicked ->
                          clicked.visibility = View.GONE
                      }
                      overlayView = it
                  }

                  view.text = text
                  view.setBackgroundColor(background)
                  view.visibility = View.VISIBLE

                  if (view.parent == null) {
                      val windowType =
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          } else {
                              WindowManager.LayoutParams.TYPE_PHONE
                          }

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          windowType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                      )

                      params.gravity = Gravity.TOP or Gravity.END
                      params.y = 120
                      params.x = 20

                      windowManager?.addView(view, params)
                  }
              }

              override fun onInterrupt() = Unit

              override fun onDestroy() {
                  overlayView?.let {
                      try {
                          windowManager?.removeView(it)
                      } catch (_: Exception) {
                      }
                  }

                  overlayView = null
                  super.onDestroy()
              }
          }
          EOF

          # Disable resource/code shrinking for the release build.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "sourceCompatibility = JavaVersion.VERSION_1_8",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )
          s = s.replace(
              "targetCompatibility = JavaVersion.VERSION_1_8",
              "targetCompatibility = JavaVersion.VERSION_17"
          )
          s = s.replace(
              "jvmTarget = JavaVersion.VERSION_1_8",
              "jvmTarget = JavaVersion.VERSION_17"
          )
          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")

          if "minifyEnabled false" not in s:
              s = s.replace(
                  "release {",
                  "release {\n            minifyEnabled false\n            shrinkResources false",
                  1
              )

          p.write_text(s)
          PY

      - name: Preflight Dart project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/main.dart

          if grep -RIn --exclude-dir=.dart_tool --exclude-dir=build \
              -E '\bMyApp\b' test 2>/dev/null; then
            echo "::error::Obsolete MyApp reference found in tests."
            exit 1
          fi

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
