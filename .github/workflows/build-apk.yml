name: Build Super Driver APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Setup Flutter
      # ==========================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================
      # 4. Show Flutter and Dart versions
      # ==========================================
      - name: Flutter version
        run: |
          flutter --version
          dart --version


      # ==========================================
      # 5. Find and extract Flutter project
      # ==========================================
      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Flutter project..."
          echo "======================================"

          mkdir -p extracted_project

          ZIP_FILE=$(find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -n "$ZIP_FILE" ]; then

            echo "Found ZIP:"
            echo "$ZIP_FILE"

            echo ""
            echo "Extracting ZIP..."

            unzip -o "$ZIP_FILE" -d extracted_project

          else

            echo "No ZIP file found."
            echo "Searching repository directly..."

            find . \
              -type f \
              -name "pubspec.yaml" \
              -not -path "./.git/*" \
              -print

            PROJECT_DIRECT=$(find . \
              -type f \
              -name "pubspec.yaml" \
              -not -path "./.git/*" \
              -printf '%h\n' \
              | head -n 1)

            if [ -n "$PROJECT_DIRECT" ]; then
              mkdir -p extracted_project
              cp -R "$PROJECT_DIRECT"/. extracted_project/
            fi

          fi


          # ======================================
          # Find pubspec.yaml
          # ======================================

          echo ""
          echo "Searching for pubspec.yaml..."

          PROJECT_DIR=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.git/*" \
            -printf '%h\n' \
            | head -n 1)


          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Flutter project not found."
            echo ""
            echo "Files found:"
            find extracted_project \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -200

            exit 1

          fi


          echo ""
          echo "======================================"
          echo "Flutter project found:"
          echo "$PROJECT_DIR"
          echo "======================================"


          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Show project structure
      # ==========================================
      - name: Show project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"

          find . \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -250


      # ==========================================
      # 7. Get dependencies
      # ==========================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get


      # ==========================================
      # 8. Fix Android Gradle configuration
      # ==========================================
      - name: Fix Android Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "Checking Android Gradle configuration"
          echo "======================================"

          GRADLE_PROPERTIES="android/gradle.properties"

          mkdir -p android

          touch "$GRADLE_PROPERTIES"


          # Remove any previous value
          sed -i \
            '/^[[:space:]]*android\.newDsl[[:space:]]*=/d' \
            "$GRADLE_PROPERTIES"


          # Disable AGP 9 new DSL temporarily
          echo "android.newDsl=false" >> "$GRADLE_PROPERTIES"


          echo ""
          echo "Current android/gradle.properties:"
          echo "--------------------------------------"

          cat "$GRADLE_PROPERTIES"

          echo "--------------------------------------"


      # ==========================================
      # 9. Check Android Gradle files
      # ==========================================
      - name: Check Android Gradle files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "======================================"
          echo "Android Gradle files"
          echo "======================================"

          echo ""
          echo "settings.gradle:"
          if [ -f "android/settings.gradle" ]; then
            cat android/settings.gradle
          else
            echo "settings.gradle not found"
          fi


          echo ""
          echo "settings.gradle.kts:"
          if [ -f "android/settings.gradle.kts" ]; then
            cat android/settings.gradle.kts
          else
            echo "settings.gradle.kts not found"
          fi


          echo ""
          echo "app/build.gradle:"
          if [ -f "android/app/build.gradle" ]; then
            cat android/app/build.gradle
          else
            echo "app/build.gradle not found"
          fi


          echo ""
          echo "app/build.gradle.kts:"
          if [ -f "android/app/build.gradle.kts" ]; then
            cat android/app/build.gradle.kts
          else
            echo "app/build.gradle.kts not found"
          fi


      # ==========================================
      # 10. Analyze project
      # ==========================================
      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze


      # ==========================================
      # 11. Run tests if tests exist
      # ==========================================
      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          if [
