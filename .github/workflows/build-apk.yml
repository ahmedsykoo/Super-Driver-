name: Build Super Driver APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Setup Flutter
      # ==========================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================
      # 4. Flutter version
      # ==========================================
      - name: Flutter version
        run: |
          flutter --version
          dart --version


      # ==========================================
      # 5. Find and extract Flutter project
      # ==========================================
      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Flutter project..."
          echo "======================================"

          mkdir -p extracted_project

          # Search for ZIP files
          ZIP_FILE=$(find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -n "$ZIP_FILE" ]; then

            echo "Found ZIP:"
            echo "$ZIP_FILE"

            echo ""
            echo "Extracting ZIP..."

            unzip -o "$ZIP_FILE" -d extracted_project

          else

            echo "No ZIP file found."
            echo "Searching repository directly..."

            cp -R . extracted_project

          fi


          # ======================================
          # Find pubspec.yaml
          # ======================================

          echo ""
          echo "Searching for pubspec.yaml..."

          PROJECT_DIR=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.git/*" \
            -printf '%h\n' \
            | head -n 1)


          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Flutter project not found."
            echo ""
            echo "Available files:"
            find extracted_project -maxdepth 4 -type f | head -100

            exit 1

          fi


          echo ""
          echo "Flutter project found:"
          echo "$PROJECT_DIR"


          # Save project path for following steps
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Show project structure
      # ==========================================
      - name: Show project structure
        run: |
          echo "Flutter project:"
          echo "${{ env.PROJECT_DIR }}"

          echo ""
          echo "Project files:"
          find "${{ env.PROJECT_DIR }}" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200


      # ==========================================
      # 7. Get dependencies
      # ==========================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get


      # ==========================================
      # 8. Analyze project
      # ==========================================
      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze


      # ==========================================
      # 9. Run tests if tests exist
      # ==========================================
      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          if [ -d "test" ] && \
             find test -type f -name "*_test.dart" | grep -q .; then

            echo "Tests found."
            flutter test

          else

            echo "No Flutter tests found."
            echo "Skipping tests."

          fi


      # ==========================================
      # 10. Build APK
      # ==========================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release


      # ==========================================
      # 11. Verify APK
      # ==========================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          echo "Checking APK..."

          if [ ! -f "$APK_PATH" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching build directory:"
            find build -type f 2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK_PATH"


      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
