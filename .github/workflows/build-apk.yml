name: Build Super Driver APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -e

          echo "Searching for Flutter project..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            mkdir -p extracted_project

            unzip -o "$ZIP_FILE" -d extracted_project

            PROJECT_DIR=$(find extracted_project \
              -type f \
              -name "pubspec.yaml" \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: pubspec.yaml not found inside ZIP."
              exit 1
            fi

            echo "Flutter project found at:"
            echo "$PROJECT_DIR"

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          else
            echo "No ZIP found."

            PROJECT_DIR=$(find . \
              -type f \
              -name "pubspec.yaml" \
              -not -path "./.git/*" \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Flutter project not found."
              exit 1
            fi

            echo "Flutter project found at:"
            echo "$PROJECT_DIR"

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

          echo "Android files:"
          ls -la "$PROJECT_DIR/android" || true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Gradle version
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          flutter test

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
