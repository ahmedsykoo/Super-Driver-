name: Build Super Driver APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Find and extract Flutter project
      # =========================================================
      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Flutter project..."
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then

            echo "Found ZIP:"
            echo "$ZIP_FILE"

            rm -rf extracted_project
            mkdir -p extracted_project

            unzip -o "$ZIP_FILE" -d extracted_project

            PROJECT_DIR=$(find extracted_project \
              -type f \
              -name "pubspec.yaml" \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: pubspec.yaml was not found."
              exit 1
            fi

          else

            echo "No ZIP found."

            PROJECT_DIR=$(find . \
              -type f \
              -name "pubspec.yaml" \
              -not -path "./.git/*" \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Flutter project was not found."
              exit 1
            fi

          fi

          echo ""
          echo "Flutter project:"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 3. Check project structure
      # =========================================================
      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project contents:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Android directory:"
          ls -la "$PROJECT_DIR/android" || true


      # =========================================================
      # 4. Setup Java
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 5. Setup Flutter
      # =========================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      # =========================================================
      # 6. Flutter version
      # =========================================================
      - name: Flutter version
        run: |
          flutter --version


      # =========================================================
      # 7. Check Android Gradle files
      # =========================================================
      - name: Check Android Gradle files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking Android Gradle files"
          echo "======================================"

          echo ""
          echo "Android directory:"
          ls -la android

          echo ""
          echo "Gradle wrapper directory:"
          ls -la android/gradle/wrapper 2>/dev/null || true

          echo ""
          echo "Checking files..."

          if [ -f "android/gradlew" ]; then
            echo "gradlew: FOUND"
          else
            echo "gradlew: MISSING"
          fi

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "gradle-wrapper.properties: FOUND"
          else
            echo "gradle-wrapper.properties: MISSING"
          fi

          if [ -f "android/settings.gradle" ]; then
            echo "settings.gradle: FOUND"
          else
            echo "settings.gradle: NOT FOUND"
          fi

          if [ -f "android/settings.gradle.kts" ]; then
            echo "settings.gradle.kts: FOUND"
          else
            echo "settings.gradle.kts: NOT FOUND"
          fi

          if [ -f "android/build.gradle" ]; then
            echo "build.gradle: FOUND"
          else
            echo "build.gradle: NOT FOUND"
          fi

          if [ -f "android/build.gradle.kts" ]; then
            echo "build.gradle.kts: FOUND"
          else
            echo "build.gradle.kts: NOT FOUND"
          fi


      # =========================================================
      # 8. Install Gradle 8.14.3
      # =========================================================
      - name: Install Gradle
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.14.3"

          echo "Installing Gradle $GRADLE_VERSION..."

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O /tmp/gradle.zip

          sudo mkdir -p /opt/gradle

          sudo unzip -q \
            /tmp/gradle.zip \
            -d /opt/gradle

          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          export PATH="/opt/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"

          gradle --version


      # =========================================================
      # 9. Create / repair Gradle Wrapper
      # =========================================================
      - name: Fix Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking Gradle Wrapper"
          echo "======================================"

          if [ -f "gradlew" ] && \
             [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Gradle wrapper already exists."

            chmod +x gradlew

          else

            echo "Gradle wrapper is missing."
            echo "Generating Gradle wrapper..."

            mkdir -p gradle/wrapper

            gradle wrapper \
              --gradle-version 8.14.3 \
              --distribution-type bin

            chmod +x gradlew

          fi

          echo ""
          echo "Gradle wrapper files:"
          find gradle -maxdepth 3 -type f -print || true

          echo ""
          echo "Testing Gradle wrapper..."

          ./gradlew --version


      # =========================================================
      # 10. Get dependencies
      # =========================================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get


      # =========================================================
      # 11. Analyze project
      # =========================================================
      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze


      # =========================================================
      # 12. Run tests
      # =========================================================
      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory found."
            echo "Skipping Flutter tests."
          fi


      # =========================================================
      # 13. Build APK
      # =========================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release


      # =========================================================
      # 14. Verify APK
      # =========================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          echo "Checking APK..."

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK_PATH"


      # =========================================================
      # 15. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
