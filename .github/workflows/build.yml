name: Build Super Driver APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 3. Flutter
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      # ============================================================
      # 4. Find and extract Flutter project
      # ============================================================
      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for Flutter project"
          echo "========================================"

          ZIP_FILE=""

          while IFS= read -r file; do
            ZIP_FILE="$file"
            break
          done < <(
            find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              | sort
          )

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP:"
            echo "$ZIP_FILE"

            rm -rf extracted_project
            mkdir -p extracted_project

            unzip -oq "$ZIP_FILE" -d extracted_project

            PROJECT_DIR="$(
              find extracted_project \
                -type f \
                -name "pubspec.yaml" \
                -not -path "*/.dart_tool/*" \
                -printf '%h\n' \
                | head -n 1
            )"

          else
            echo "No ZIP file found."

            PROJECT_DIR="$(
              find . \
                -type f \
                -name "pubspec.yaml" \
                -not -path "./.git/*" \
                -not -path "*/.dart_tool/*" \
                -printf '%h\n' \
                | head -n 1
            )
          fi

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ERROR: Flutter project was not found."
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "Flutter project:"
          echo "$PROJECT_DIR"
          echo ""

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 5. Check project
      # ============================================================
      - name: Check Flutter project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Flutter project structure"
          echo "========================================"

          pwd

          echo ""
          echo "pubspec.yaml:"
          test -f pubspec.yaml

          echo ""
          echo "Android directory:"
          if [ -d android ]; then
            echo "FOUND"
          else
            echo "ERROR: android directory is missing."
            exit 1
          fi

          echo ""
          echo "Android files:"
          find android -maxdepth 3 -type f | sort | head -100 || true

      # ============================================================
      # 6. Prepare Android local.properties
      # ============================================================
      - name: Prepare Android local properties
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android

          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_ROOT
          EOF

          echo "Created android/local.properties"

          cat android/local.properties

      # ============================================================
      # 7. Configure Gradle / Android
      # ============================================================
      - name: Configure Android Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android

          touch android/gradle.properties

          if grep -q '^android.newDsl=' android/gradle.properties; then
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' android/gradle.properties
          else
            echo 'android.newDsl=false' >> android/gradle.properties
          fi

          echo ""
          echo "========================================"
          echo "gradle.properties"
          echo "========================================"

          cat android/gradle.properties

      # ============================================================
      # 8. Install Gradle 8.14
      # ============================================================
      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.14"
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            echo "Downloading Gradle $GRADLE_VERSION..."

            curl -L --fail --retry 3 \
              -o "$RUNNER_TEMP/gradle.zip" \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

            rm -rf "$GRADLE_HOME"

            mkdir -p "$GRADLE_HOME"

            unzip -q \
              "$RUNNER_TEMP/gradle.zip" \
              -d "$RUNNER_TEMP"

            mv \
              "$RUNNER_TEMP/gradle-${GRADLE_VERSION}" \
              "$GRADLE_HOME"
          fi

          echo "GRADLE_HOME=$GRADLE_HOME" >> "$GITHUB_ENV"
          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

          "$GRADLE_HOME/bin/gradle" --version

      # ============================================================
      # 9. Fix / create Gradle wrapper
      # ============================================================
      - name: Fix Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking Gradle Wrapper"
          echo "========================================"

          mkdir -p android/gradle/wrapper

          cd android

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper is missing."
            echo "Generating wrapper using Gradle 8.14..."

            gradle wrapper \
              --gradle-version 8.14 \
              --distribution-type bin
          else
            echo "gradlew exists."
          fi

          chmod +x gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: gradle-wrapper.properties was not generated."
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle-wrapper.jar was not generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Gradle wrapper configuration"
          echo "========================================"

          cat gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ============================================================
      # 10. Validate Android Gradle files
      # ============================================================
      - name: Check Android Gradle files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking Android Gradle files"
          echo "========================================"

          test -f android/settings.gradle \
            || test -f android/settings.gradle.kts \
            || {
              echo "ERROR: Android settings file not found."
              exit 1
            }

          test -f android/build.gradle \
            || test -f android/build.gradle.kts \
            || {
              echo "ERROR: Android build.gradle file not found."
              exit 1
            }

          test -f android/app/build.gradle \
            || test -f android/app/build.gradle.kts \
            || {
              echo "ERROR: Android app Gradle file not found."
              exit 1
            }

          echo "Android Gradle files found."

      # ============================================================
      # 11. Fix resource shrinking configuration
      # ============================================================
      - name: Fix Android build configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking resource shrinking"
          echo "========================================"

          GRADLE_FILE=""

          if [ -f android/app/build.gradle ]; then
            GRADLE_FILE="android/app/build.gradle"
          elif [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

          echo "Using:"
          echo "$GRADLE_FILE"

          # Resource shrinking requires code shrinking.
          # If the project explicitly enables resource shrinking
          # without minification, disable resource shrinking.
          python3 - "$GRADLE_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          replacements = {
              "shrinkResources = true": "shrinkResources = false",
              "isShrinkResources = true": "isShrinkResources = false",
          }

          changed = False

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True

          path.write_text(text)

          if changed:
              print("Resource shrinking configuration adjusted.")
          else:
              print("No incompatible resource shrinking configuration found.")
          PY

          echo ""
          echo "Android build configuration checked."

      # ============================================================
      # 12. Flutter dependencies
      # ============================================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

      # ============================================================
      # 13. Flutter analyze
      # ============================================================
      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze

      # ============================================================
      # 14. Run tests
      # ============================================================
      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if find test -type f -name "*_test.dart" -print -quit 2>/dev/null | grep -q .; then
            echo "Tests found. Running Flutter tests..."
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi

      # ============================================================
      # 15. Check Gradle
      # ============================================================
      - name: Gradle version
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 16. Build APK
      # ============================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building Super Driver APK"
          echo "========================================"

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      # ============================================================
      # 17. Verify APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "========================================"
          echo "Verifying APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            echo ""
            echo "Available APK files:"
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo ""
          echo "APK size:"
          du -h "$APK"

          echo ""
          echo "APK information:"
          file "$APK"

          echo ""
          echo "APK verification completed successfully."

      # ============================================================
      # 18. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
