name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify before APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./settings.gradle.kts
          test -f ./build.gradle.kts
          test -f ./app/build.gradle.kts
          test -f ./gradle/wrapper/gradle-wrapper.properties
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./app/src/main/AndroidManifest.xml
          test -d ./app/src/main/java/com/superdriver/app
          test -d ./app/src/test/java/com/superdriver/app
          chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

  build:
    name: Build and package APKs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/*.apk build-artifacts/
          cp app/build/outputs/apk/release/*.apk build-artifacts/
          (cd build-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          cat build-artifacts/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-egypt-apks
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 30
