name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./settings.gradle.kts
          test -f ./build.gradle.kts
          test -f ./app/build.gradle.kts
          test -f ./gradle/wrapper/gradle-wrapper.properties
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./app/src/main/AndroidManifest.xml
          test -d ./app/src/main/java/com/superdriver/app
          test -d ./app/src/test/java/com/superdriver/app
          test ! -d ./_build_source
          chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace --no-daemon
        continue-on-error: true
