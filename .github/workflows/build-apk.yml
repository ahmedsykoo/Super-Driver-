name: Build Super Driver APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/superdriver/app/MainActivity.kt
          test -f android/app/src/main/kotlin/com/superdriver/app/UberAccessibilityService.kt
          test -f android/app/src/main/res/xml/accessibility_service_config.xml

      - name: Prepare Flutter local properties
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          echo "Flutter SDK: $FLUTTER_ROOT"
          cat android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "io.flutter.app\." android/app/src/main
          ! grep -R "PluginRegistry.Registrar" android/app/src/main
          ! grep -R "MyApp" test lib

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3 --distribution-type bin

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
