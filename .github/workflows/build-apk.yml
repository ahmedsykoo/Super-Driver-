name: Build Super Driver APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            mkdir -p extracted_project
            unzip -o "$ZIP_FILE" -d extracted_project

            PROJECT_DIR=$(find extracted_project -type f -name "pubspec.yaml" -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Could not find pubspec.yaml"
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          else
            echo "No ZIP found. Looking for pubspec.yaml..."

            PROJECT_DIR=$(find . -type f -name "pubspec.yaml" -not -path "./.git/*" -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Could not find Flutter project."
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
