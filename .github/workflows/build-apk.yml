name: Build Super Driver APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Flutter version
      # --------------------------------------------------
      - name: Flutter version
        run: |
          flutter --version
          dart --version

      # --------------------------------------------------
      # 5. Find Flutter project
      # --------------------------------------------------
      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Flutter project..."

          PROJECT_DIR=""

          # First: look for pubspec.yaml in repository
          PROJECT_DIR=$(find . \
            -type f \
            -name "pubspec.yaml" \
            -not -path "./.git/*" \
            -not -path "./extracted_project/*" \
            -printf '%h\n' \
            | head -n 1 || true)

          # Second: look inside ZIP files
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              | head -n 1 || true)

            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP: $ZIP_FILE"

              rm -rf extracted_project
              mkdir -p extracted_project

              unzip -o "$ZIP_FILE" -d extracted_project

              PROJECT_DIR=$(find extracted_project \
                -type f \
                -name "pubspec.yaml" \
                -printf '%h\n' \
                | head -n 1 || true)
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project was not found."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort | head -n 300
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. Check project structure
      # --------------------------------------------------
      - name: Check project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/pubspec.yaml"

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Android folder not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/android/settings.gradle.kts" ]; then
            echo "ERROR: Android settings file not found."
            exit 1
          fi

          echo "Project structure OK."

      # --------------------------------------------------
      # 7. Fix Android Gradle configuration
      # --------------------------------------------------
      - name: Fix Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"
          GRADLE_PROPERTIES="$ANDROID_DIR/gradle.properties"

          echo "Android directory:"
          echo "$ANDROID_DIR"

          touch "$GRADLE_PROPERTIES"

          # Prevent Flutter/AGP 9 DSL migration from breaking
          # older Flutter Android projects.
          if grep -q "^android.newDsl=" "$GRADLE_PROPERTIES"; then
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' "$GRADLE_PROPERTIES"
          else
            echo "android.newDsl=false" >> "$GRADLE_PROPERTIES"
          fi

          echo ""
          echo "Current gradle.properties:"
          cat "$GRADLE_PROPERTIES"

          echo ""
          echo "Checking Android Gradle files..."

          if [ -f "$ANDROID_DIR/app/build.gradle" ]; then
            echo "Found app/build.gradle"
          fi

          if [ -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            echo "Found app/build.gradle.kts"
          fi

          if [ -f "$ANDROID_DIR/settings.gradle" ]; then
            echo "Found settings.gradle"
          fi

          if [ -f "$ANDROID_DIR/settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
          fi

      # --------------------------------------------------
      # 8. Get dependencies
      # --------------------------------------------------
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      # --------------------------------------------------
      # 9. Analyze project
      # --------------------------------------------------
      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze

      # --------------------------------------------------
      # 10. Run tests
      # --------------------------------------------------
      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "test" ] && find test -type f -name "*_test.dart" | grep -q .; then
            echo "Tests found. Running Flutter tests..."
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi

      # --------------------------------------------------
      # 11. Build APK
      # --------------------------------------------------
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release

      # --------------------------------------------------
      # 12. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available APK files:"
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      # --------------------------------------------------
      # 13. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
