name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android Gradle project
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          echo "Gradle project verified."
          echo "Gradle distribution:"
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: Show Java and Gradle versions
        working-directory: android
        shell: bash
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk              artifacts/Super-Driver-Egypt-Arabic-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Driver-Egypt-Arabic-debug
          path: artifacts/Super-Driver-Egypt-Arabic-debug.apk
          if-no-files-found: error
          retention-days: 14
